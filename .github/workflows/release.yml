# Signed Web Builder release + updater feed (latest.json).
# Requires repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY          — contents of the .key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional
#
# Before the first public release: push this repo to GitHub. The workflow
# replaces OWNER/REPO in tauri.conf.json with github.repository automatically.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-14
            rust_target: aarch64-apple-darwin
          - platform: macos-13
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Point updater endpoint at this repository
        shell: bash
        run: |
          conf="src-tauri/tauri.conf.json"
          sed -i.bak "s|OWNER/REPO|${{ github.repository }}|g" "$conf"
          rm -f "$conf.bak"
          grep -n 'endpoints' -A2 "$conf"

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target ${{ matrix.rust_target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**
            src-tauri/target/**/release/bundle/**/*.sig

  latest-json:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble latest.json
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist-upd
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.sig' -o -name '*.nsis.zip' \) -exec cp -n {} dist-upd/ \;
          bun scripts/make-latest-json.mjs \
            --dir dist-upd \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --notes "Web Builder $TAG" \
            --out dist-upd/latest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-upd/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
